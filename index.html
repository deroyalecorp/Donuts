<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De'Royale Donuts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="brand-container">
                <h1>De'Royale Donuts</h1>
                <span class="tagline">Royale in Every Bite</span>
            </div>
            <button id="cart-toggle" class="btn-gold-outline">🛒 Keranjang (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <main>
        <!-- Hero Section: Banner Announcement & Countdown -->
        <section class="grand-opening-banner">
            <h2>Save the date!</h2>
            <p class="opening-subtitle">Grand Opening De'Royale Donuts 7 Agustus 2026</p>
            <div id="countdown" class="countdown-container">
                <div class="time-box"><span id="days">00</span><label>Hari</label></div>
                <div class="time-box"><span id="hours">00</span><label>Jam</label></div>
                <div class="time-box"><span id="minutes">00</span><label>Menit</label></div>
                <div class="time-box"><span id="seconds">00</span><label>Detik</label></div>
            </div>
        </section>

        <div id="menu-container"></div>
        
        <div class="finish-section">
            <button id="btn-selesai" class="btn-gold large">Selesai Memilih</button>
        </div>
    </main>

    <!-- Sidebar Keranjang -->
    <div id="cart-sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Keranjang Anda</h2>
            <button id="close-cart" class="btn-close">&times;</button>
        </div>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">Total: <span id="total-price">Rp 0</span></div>
            <button id="btn-checkout-modal" class="btn-gold full-width">Checkout via WhatsApp</button>
        </div>
    </div>
    <div id="overlay" class="overlay"></div>

    <!-- Modal Checkout -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <button id="close-modal" class="btn-close">&times;</button>
            <h2>Detail Pengiriman</h2>
            <form id="form-checkout">
                <div class="form-group">
                    <label>Nama Lengkap *</label>
                    <input type="text" id="cust-name" required placeholder="Masukkan nama Anda">
                </div>
                
                <div class="form-group">
                    <label>Opsi Pengiriman</label>
                    <select id="delivery-option" required>
                        <option value="Ambil Sendiri">Ambil Sendiri (Pickup)</option>
                        <option value="Kirim">Kirim (Delivery)</option>
                    </select>
                </div>

                <div class="form-group" id="pickup-date-group">
                    <label id="date-label">Tanggal Pengambilan *</label>
                    <input type="date" id="pickup-date" required>
                </div>

                <div class="form-group" id="address-group" style="display: none;">
                    <label>Alamat Lengkap & Patokan *</label>
                    <textarea id="address" rows="3" placeholder="Jalan, No Rumah, RT/RW, Patokan..."></textarea>
                    
                    <label style="margin-top: 10px;">Link Share Lokasi (Maps)</label>
                    <input type="url" id="maps-link" placeholder="Cth: https://maps.app.goo.gl/...">
                </div>

                <div class="form-group">
                    <label>Metode Pembayaran</label>
                    <select id="payment-method" required>
                        <option value="QRIS">QRIS</option>
                        <option value="Cash">Cash (Bayar di tempat)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Catatan Tambahan (Opsional)</label>
                    <textarea id="notes" rows="2" placeholder="Cth: Pisahkan gulanya..."></textarea>
                </div>

                <button type="submit" class="btn-gold full-width mt-10">Kirim Pesanan</button>
            </form>
        </div>
    </div>

    <div id="toast"></div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
